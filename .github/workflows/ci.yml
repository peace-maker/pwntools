name: Continuous Integration
on: [push, pull_request]

jobs:

  windows-test:
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    
    - uses: Vampire/setup-wsl@v6
      with:
        distribution: Ubuntu-24.04
        use-cache: 'true'
        additional-packages:
          openssh-server

    - name: Setup SSH config on host
      shell: bash
      run: |
        mkdir -p ~/.ssh
        ssh-keygen -t rsa -f ~/.ssh/travis -N ''
        wsl --distribution 'Ubuntu-24.04' hostname -I
        cat >> ~/.ssh/config <<EOF
        Host example.pwnme
            User travis
            HostName $(wsl --distribution 'Ubuntu-24.04' hostname -I)
            Port 2200
            IdentityFile ~/.ssh/travis
            StrictHostKeyChecking no
        EOF

    - name: Setup SSH server in WSL2
      shell: wsl-bash {0}
      run: |
        set -e
        # https://github.com/gardengim/keepwsl
        cat > /etc/systemd/system/keepwsl.service <<EOF
        [Unit]
        Description=keepwsl.service

        [Service]
        Type=simple
        ExecStart=/mnt/c/Windows/System32/wsl.exe --exec /bin/sleep infinity
        Restart=always
        RestartSec=5

        [Install]
        WantedBy=default.target
        EOF
        sed -i 's/#Port 22/Port 2200/' /etc/ssh/sshd_config
        systemctl daemon-reload
        systemctl restart ssh.socket
        systemctl enable keepwsl
        systemctl start keepwsl
        useradd -m travis
        passwd --delete --unlock travis
        chsh --shell /bin/bash travis
        mkdir -p /home/travis/.ssh && chmod 700 /home/travis/.ssh
        cp /mnt/c/Users/runneradmin/.ssh/travis.pub /home/travis/.ssh/authorized_keys
        chown -R travis:travis /home/travis/.ssh
        chmod 600 /home/travis/.ssh/authorized_keys

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install --upgrade .

    - name: Install documentation dependencies
      run: pip install -r docs/requirements.txt

    - name: Sanity checks
      run: |
        ssh -v travis@example.pwnme id
        python -bb -c 'from pwn import *'
        python -bb examples/text.py

    - name: Coverage doctests
      run: |
        python -bb -m coverage run -m sphinx -b doctest docs/source docs/build/doctest

